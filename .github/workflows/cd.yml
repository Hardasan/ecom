name: CD

# After a merge to main: publish the image and deploy. Tests already ran on the PR (CI).
# Skip auto-deploy: put "skip cd" (or [skip cd]) in the merge/push commit message.
# Deploy later: Actions → CD → Run workflow. Release tags still deploy.
#
# Required repository secret: SSH_PRIVATE_KEY
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish image
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'skip cd')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit
    with:
      image: ${{ needs.publish.outputs.image }}
