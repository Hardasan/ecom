name: CI

# Tests only. No Docker image, no publish, no deploy.
# Runs on PRs and on pushes to main. Shipping is the Release workflow (push a v* tag).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest   # ships a Docker daemon, which Testcontainers (*ITest) needs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven          # caches ~/.m2 keyed on pom.xml

      # `-P release` enables the *UTest tier (surefire); `verify` runs the *ITest
      # tier (failsafe), which boots Testcontainers PostgreSQL + in-process WireMock.
      - name: Build, unit tests and integration tests
        run: mvn -B --no-transfer-progress -P release verify

      - name: Upload Boot jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-jar
          path: ecommerce-backend/target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            ecommerce-backend/target/surefire-reports/
            ecommerce-backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
