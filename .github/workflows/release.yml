name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes the jar + versioned GHCR image (also tagged :latest), then SSHes to the
# VPS and rolls it out with `docker compose pull ecom && docker compose up -d`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the GitHub Release
  packages: write   # required to push the image to GHCR

jobs:
  release:
    name: Build & publish jar + image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Full verify so a tagged build is gated on the same tests as CI.
      - name: Build and test
        run: mvn -B --no-transfer-progress -P release verify

      - name: Create GitHub Release with jar
        uses: softprops/action-gh-release@v3
        with:
          files: ecommerce-backend/target/*.jar
          generate_release_notes: true

      - name: Set image name
        id: image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag the image with the release version (without the leading "v") and latest.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: release
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit
    with:
      image: ${{ needs.release.outputs.image }}
