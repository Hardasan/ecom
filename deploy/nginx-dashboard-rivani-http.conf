# Admin dashboard host: dashboard.rivany.ir — INTERIM HTTP-ONLY vhost.
# The origin currently sits behind a CDN and serves plain HTTP (TLS is terminated at the edge, and
# the box has no certbot / no :443). This makes the origin answer for the dashboard subdomain over
# HTTP so it can be wired up now. Switch to nginx-dashboard-rivani.conf (adds the :443 vhost +
# certbot) once TLS is set up.
#
# Install: copy to /etc/nginx/sites-available/dashboard-rivani, symlink into sites-enabled,
#          then `nginx -t && systemctl reload nginx`.
# Requires DNS: dashboard.rivany.ir must resolve to this origin — an A record to 45.94.215.219,
#          or a CDN/edge record that forwards to it.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.rivany.ir;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
