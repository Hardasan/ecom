# Admin dashboard host: dashboard.rivany.ir
# Same backend as the storefront (127.0.0.1:8080) — the served SPA is host-aware and shows the admin
# login + dashboard when the browser is on this hostname. No backend or separate build is needed.
#
# One-time setup on the VPS:
#   1. DNS: add an A/AAAA record  dashboard.rivany.ir -> <server IP>  (same host as rivany.ir).
#   2. TLS: issue a cert for the subdomain, e.g.
#          certbot --nginx -d dashboard.rivany.ir
#      (or add  -d dashboard.rivany.ir  to your existing certbot command and run with --expand).
#   3. Install this file (e.g. /etc/nginx/sites-available/dashboard-rivani.conf), enable it, then
#          nginx -t && systemctl reload nginx
#
# NOTE: the existing nginx-rivani.conf uses `server_name _` (a catch-all), so over plain HTTP the
# subdomain already reaches the backend. This file adds the subdomain's own HTTPS vhost.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.rivany.ir;

    # Allow ACME HTTP-01 challenges, send everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.rivany.ir;

    ssl_certificate     /etc/letsencrypt/live/dashboard.rivany.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.rivany.ir/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
