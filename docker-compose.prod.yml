# Production stack: custom app image + Postgres. Host Nginx proxies to 127.0.0.1:8080.
# Postgres/Redis stay on the compose network (not published).
#
# The app image is pulled straight from GHCR, so on the server you deploy with:
#   docker compose pull ecom && docker compose up -d
# ECOM_TAG selects which published tag to run (defaults to the newest release, :latest).
# Pin/roll back by setting ECOM_TAG in .env, e.g. ECOM_TAG=0.1.0.

name: rivani

services:
  postgres:
    image: postgres:17-alpine
    container_name: rivani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    container_name: rivani-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  ecom:
    image: ghcr.io/hardasan/ecom:${ECOM_TAG:-latest}
    container_name: rivani
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
      SPRING_DATASOURCE_USERNAME: ecom
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CACHE_TYPE: caffeine
      SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  postgres_data:
  redis_data:
