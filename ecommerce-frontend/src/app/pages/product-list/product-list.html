<div class="page product-list">
  <div class="page-scroll">
    <header class="top-bar">
      <a routerLink="/" class="icon-btn" aria-label="بازگشت">
        <img [src]="a.iconBack" alt="" width="8" height="16" />
      </a>
      <p class="top-bar__title">{{ title() }}</p>
      <span class="spacer"></span>
    </header>

    <!-- Desktop heading — the phone top-bar is hidden at ≥1024px, so restate the list title here. -->
    <h1 class="list-heading">{{ title() }}</h1>

    @if (loading()) {
      <p class="state">در حال بارگذاری…</p>
    } @else if (error()) {
      <p class="state error">{{ error() }}</p>
    } @else if (!products().length) {
      <p class="state">محصولی یافت نشد</p>
    } @else {
      <div class="list">
        @for (p of products(); track p.id) {
          <a [routerLink]="['/product', p.id]" class="list-card">
            <div class="list-card__body">
              <h2>{{ nameOf(p) }}</h2>
              <p class="price">{{ priceOf(p) }}</p>
            </div>
            @if (imgOf(p); as src) {
              <img class="list-card__img" [src]="src" [alt]="nameOf(p)" width="88" height="88" loading="lazy" decoding="async" />
            }
          </a>
        }
      </div>
    }
  </div>
</div>
