<div class="page profile">
  <div class="page-scroll">
    <!-- Desktop heading — the phone view is a clean tab root (no top-bar, per the design). -->
    <h1 class="profile-heading">حساب کاربری</h1>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <div class="profile-body">
      <header class="hub-head">
        <span class="avatar"><img [src]="a.iconUser" alt="" width="40" height="40" /></span>
        <p class="hub-phone">{{ (mobile || displayName()) | faNum }}</p>
      </header>

      <div class="stat-row">
        <a routerLink="/orders" class="stat-card">
          <span class="stat-card__head">
            <span class="stat-card__label">سفارش‌های جاری</span>
            <span class="stat-ic"><i class="pic pic--hourglass"></i></span>
          </span>
          <span class="stat-card__value">{{ currentOrdersCount() | faNum }}</span>
        </a>
        <a routerLink="/wishlist" class="stat-card">
          <span class="stat-card__head">
            <span class="stat-card__label">علاقه‌مندی‌ها</span>
            <span class="stat-ic"><i class="pic pic--heart"></i></span>
          </span>
          <span class="stat-card__value">{{ wishlistCount() | faNum }}</span>
        </a>
      </div>

      <nav class="menu">
        <a routerLink="/orders" class="menu-row">
          <span class="menu-row__ic"><i class="pic pic--orders"></i></span>
          <span class="menu-row__label">سفارشات</span>
          <span class="menu-row__chev" aria-hidden="true">‹</span>
        </a>
        <a routerLink="/my-reviews" class="menu-row">
          <span class="menu-row__ic"><i class="pic pic--reviews"></i></span>
          <span class="menu-row__label">نظرات</span>
          <span class="menu-row__chev" aria-hidden="true">‹</span>
        </a>
        <button type="button" class="menu-row" (click)="comingSoon()">
          <span class="menu-row__ic"><i class="pic pic--bell"></i></span>
          <span class="menu-row__label">یادآوری‌ها</span>
          <span class="menu-row__chev" aria-hidden="true">‹</span>
        </button>
        <a routerLink="/addresses" class="menu-row">
          <span class="menu-row__ic"><i class="pic pic--address"></i></span>
          <span class="menu-row__label">آدرس‌ها</span>
          <span class="menu-row__chev" aria-hidden="true">‹</span>
        </a>
        <a routerLink="/account" class="menu-row">
          <span class="menu-row__ic"><i class="pic pic--settings"></i></span>
          <span class="menu-row__label">تنظیمات کاربری</span>
          <span class="menu-row__chev" aria-hidden="true">‹</span>
        </a>
        <button type="button" class="menu-row menu-row--danger" (click)="logout()">
          <span class="menu-row__ic"><i class="pic pic--logout"></i></span>
          <span class="menu-row__label">خروج</span>
        </button>
      </nav>
    </div>
  </div>

  <app-bottom-nav active="profile" />

  @if (toast()) {
    <div class="toast">{{ toast() }}</div>
  }
</div>
